<h2>রড সিমেন্টের দুকানে টাকা দেওয়া হয়েছে </h2>

<!-- আইটেম+রিসিট টেবিল -->
<table>
  <thead>
    <tr>
      <th>ক্রমিক</th>

    </tr>
  </thead>
  <tbody id="itemTable"></tbody>

    <tr class="total-row">
      <td colspan="2">মোট</td>
      <td id="totalAmount"></td>

    </tr>
  </tfoot>
</table>

<!-- লাইটবক্স -->
<div id="lightbox" class="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg" src="">
</div>

<script>
  // বাংলা সংখ্যায় কনভার্ট
  function toBanglaNumber(n) {
    const eng = "0123456789";
    const bng = "০১২৩৪৫৬৭৮৯";
    return n.toString().split("").map(ch => eng.includes(ch)? bng[eng.indexOf(ch)]: ch).join("");
  }

 let loadData = async ()=>{
   try{
   let res = await fetch("../database.json");
   let data = await res.json();
   let itemsData = data.RotCementDukan;
 
  // টেবিল পূরণের ফাংশন (সাধারণ)
  function fillTable(id, data, totalId) {
    let tbody = document.getElementById(id);
    let total = 0;
    data.forEach((row, i) => {
      let tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${toBanglaNumber(i+1)}</td>
        <td>${row[0]}</td>
        <td>${toBanglaNumber(row[1])}</td>
      `;
      tbody.appendChild(tr);
      total += row[1];
    });
    document.getElementById(totalId).innerText = toBanglaNumber(total);
    return total;
  }

  // আইটেম+রিসিট টেবিল
  let tbodyItem = document.getElementById("itemTable");
  let totalItem = 0;
  itemsData.forEach((row, i) => {
    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${toBanglaNumber(i+1)}</td>
      <td>${row[0]}</td>
      <td>${toBanglaNumber(row[1])}</td>
      <td>
        ${row[2] !== "-" ? `<img src="${row[2]}" style="width:50px; cursor:pointer;" onclick="showLightbox('${row[2]}')">` : "-"}
      </td>
    `;
    tbodyItem.appendChild(tr);
    totalItem += row[1];
  });
  document.getElementById("totalAmount").innerText = toBanglaNumber(totalItem);
  }catch(err){
   console.log(err.message)
  }
}
  // লাইটবক্স দেখানোর ফাংশন
  function showLightbox(src) {
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").style.display = "flex";
  }
 
 loadData()
</script>
<script src="../script.js"></script>
