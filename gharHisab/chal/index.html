<h2>চালের খরচ</h2>

<!-- চালের খরচ -->
<table>
  <thead>
    <tr><th colspan="3" class="section-title">কাঠমিস্ত্রিকে দেওয়া</th></tr>
    <tr><th>ক্রমিক</th><th>তারিখ</th><th>টাকা</th></tr>
  </thead>
  <tbody id="chalBody"></tbody>
  <tfoot>
    <tr class="total-row"><td colspan="2">মোট</td><td id="chalTotal"></td></tr>
  </tfoot>
</table>

<!-- উপকরণের খরচ -->
<table>
  <thead>
    <tr><th colspan="3" class="section-title">উপকরণের খরচ</th></tr>
    <tr><th>ক্রমিক</th><th>আইটেম</th><th>টাকা</th></tr>
  </thead>
  <tbody id="costBody"></tbody>
  <tfoot>
    <tr class="total-row"><td colspan="2">মোট</td><td id="costTotal"></td></tr>
  </tfoot>
</table>

<!-- সর্বমোট -->
<table>
  <tfoot>
    <tr class="grand-total"><td colspan="2">সর্বমোট</td><td id="grandTotal"></td></tr>
  </tfoot>
</table>

<script>
  // বাংলা সংখ্যায় কনভার্ট
  function toBanglaNumber(n){
    const eng = "0123456789";
    const bng = "০১২৩৪৫৬৭৮৯";
    return n.toString().split("").map(ch => eng.includes(ch) ? bng[eng.indexOf(ch)] : ch).join("");
  }

  // তারিখ ফরম্যাট (dd-mm-2025)
  function formatDate(d){
    if(d === "-") return "-";
    let parts = d.split("-");
    return toBanglaNumber(parts[0]) + "-" + toBanglaNumber(parts[1]) + "-২০২৫";
  }

  let loadData = async ()=>{
    try{
      let res = await fetch("../database.json");
      let data = await res.json();
      let chalData = data.chal.chalMistri;
      let costData = data.chal.chalMal;
    
  // টেবিল পূরণ ফাংশন
  function fillTable(tbodyId, data, totalId, isDate=false){
    let tbody = document.getElementById(tbodyId);
    let total = 0;
    data.forEach((row,i)=>{
      let tr = document.createElement("tr");
      if(isDate){
        tr.innerHTML = `<td>${toBanglaNumber(i+1)}</td><td>${formatDate(row[0])}</td><td>${toBanglaNumber(row[1])}</td>`;
      }else{
        tr.innerHTML = `<td>${toBanglaNumber(i+1)}</td><td>${row[0]}</td><td>${toBanglaNumber(row[1])}</td>`;
      }
      tbody.appendChild(tr);
      total += row[1];
    });
    document.getElementById(totalId).innerText = toBanglaNumber(total);
    return total;
  }

  let totalChal = fillTable("chalBody", chalData, "chalTotal", true);
  let totalCost = fillTable("costBody", costData, "costTotal");

  // গ্র্যান্ড টোটাল
  document.getElementById("grandTotal").innerText = toBanglaNumber(totalChal + totalCost);
    }catch(err){
      console.log(err.message)
    }
  }
  loadData()
</script>
<script src="../script.js"></script>
