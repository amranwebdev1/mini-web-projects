  <!-- প্রিন্ট বাটন -->
  <button class="print-btn" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
  <h2>দরজা-জানালার জন্য</h2>

  <!-- dulavaike taka dewa hoyeche-->
  <table>
    <thead>
      <tr>
        <th>ক্রমিক</th>
        <th>তারিখ</th>
        <th>টাকা</th>
      </tr>
    </thead>
    <tbody id="ghar"></tbody>
    <tfoot>
      <tr class="total-row">
        <td colspan="2">মোট</td>
        <td id="gharTotal"></td>
      </tr>
    </tfoot>
  </table>
  <!-- সর্বমোট -->
  <table>
    <tfoot>
      <tr class="grand-total">
        <td colspan="2">সর্বমোট</td>
        <td id="grandTotal"></td>
      </tr>
    </tfoot>
  </table>

  <script>
    // বাংলা সংখ্যায় কনভার্ট
    function toBanglaNumber(n) {
      const eng = "0123456789";
      const bng = "০১২৩৪৫৬৭৮৯";
      return n.toString().split("").map(ch => eng.includes(ch) ? bng[eng.indexOf(ch)] : ch).join("");
    }

    // তারিখ ফরম্যাট
    function formatDate(d) {
      let parts = d.split("/");
      return toBanglaNumber(parts[0]) + "-" + toBanglaNumber(parts[1]) + "-২০২৫";
    }

    // ডাটা
  let loadData = async ()=>{
    try{
      let res = await fetch("database.json");
      let data = await res.json();
      let brotherData = data.doorWindow;
   
    // টেবিল পূরণ
    function fillTable(id, data, totalId) {
      let tbody = document.getElementById(id);
      let total = 0;
      data.forEach((row, i) => {
        let tr = document.createElement("tr");
        tr.innerHTML = `<td>${toBanglaNumber(i+1)}</td><td>${formatDate(row[0])}</td><td>${toBanglaNumber(row[1])}</td>`;
        tbody.appendChild(tr);
        total += row[1];
      });
      document.getElementById(totalId).innerText = toBanglaNumber(total);
      return total;
    }

    let totaldoor_window = fillTable("ghar", brotherData, "gharTotal");
    

    // গ্র্যান্ড টোটাল
    document.getElementById("grandTotal").innerText = toBanglaNumber(totaldoor_window);
    
    }catch(err){
      console.log(err.message)
    }
  }
  loadData()
  </script>
  <script src="script.js"></script>
</body>
